<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分形树与风场模拟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌳 分形树与风场模拟</h1>
        
        <div class="main-content">
            <div class="canvas-container">
                <canvas id="treeCanvas"></canvas>
            </div>
            
            <div class="control-panel">
                <div class="section">
                    <h2>🌿 树参数</h2>
                    
                    <div class="control">
                        <label>分支角度: <span id="angleValue">25</span>°</label>
                        <input type="range" id="angle" min="5" max="60" value="25">
                    </div>
                    
                    <div class="control">
                        <label>长度缩减比: <span id="lengthRatioValue">0.7</span></label>
                        <input type="range" id="lengthRatio" min="0.5" max="0.9" step="0.01" value="0.7">
                    </div>
                    
                    <div class="control">
                        <label>递归深度: <span id="depthValue">8</span></label>
                        <input type="range" id="depth" min="3" max="12" value="8">
                    </div>
                    
                    <div class="control">
                        <label>初始枝干长度: <span id="initialLengthValue">100</span></label>
                        <input type="range" id="initialLength" min="50" max="150" value="100">
                    </div>
                    
                    <div class="control">
                        <label>枝干粗细: <span id="branchWidthValue">8</span></label>
                        <input type="range" id="branchWidth" min="2" max="15" value="8">
                    </div>
                </div>
                
                <div class="section">
                    <h2>💨 风场参数</h2>
                    
                    <div class="control">
                        <label>风力强度: <span id="windStrengthValue">0</span></label>
                        <input type="range" id="windStrength" min="0" max="50" value="0">
                    </div>
                    
                    <div class="control">
                        <label>风速: <span id="windSpeedValue">1</span></label>
                        <input type="range" id="windSpeed" min="0.1" max="5" step="0.1" value="1">
                    </div>
                    
                    <div class="control">
                        <label>风向: <span id="windDirectionValue">0</span>°</label>
                        <input type="range" id="windDirection" min="-90" max="90" value="0">
                    </div>
                </div>
                
                <div class="section">
                    <h2>🍂 树叶参数</h2>
                    
                    <div class="control">
                        <label>树叶数量: <span id="leafCountValue">100</span></label>
                        <input type="range" id="leafCount" min="20" max="300" value="100">
                    </div>
                    
                    <div class="control">
                        <label>树叶大小: <span id="leafSizeValue">8</span></label>
                        <input type="range" id="leafSize" min="3" max="15" value="8">
                    </div>
                </div>
                
                <div class="section">
                    <h2>⚙️ 操作</h2>
                    
                    <div class="button-group">
                        <button id="saveConfig">💾 保存配置</button>
                        <button id="takeScreenshot">📷 截图保存</button>
                        <button id="reset">🔄 重置参数</button>
                    </div>
                    
                    <div class="configs-list" id="configsList">
                        <h3>已保存配置</h3>
                        <div id="configsContainer"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
